<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Provay - Panel de Mantenimiento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <aside class="barra-lateral">
    <div class="logo">Provay CMMS</div>
    <nav class="menu-navegacion">
      <a href="index.html" class="enlace-activo">Solicitudes</a>
      <a href="tecnico.html">Terminal Técnicos</a>
    </nav>
    <div class="usuario-rol">Encargada de Mantenimiento</div>
  </aside>

  <main class="contenido-principal">
    <header class="encabezado-superior">
      <h2>Control de Mantenimiento</h2>
      <button class="boton-primario" onclick="abrirModal()">+ Nuevo Reporte</button>
    </header>

    <section class="contenedor-tabla">
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button id="btn-activas" class="boton-primario" onclick="cambiarVista('activas')">Solicitudes Activas</button>
        <button id="btn-historial" class="boton-secundario" onclick="cambiarVista('historial')">Bitácora / Historial</button>
      </div>

      <table class="tabla-solicitudes">
        <thead>
          <tr>
            <th>ID</th>
            <th>Fechas</th>
            <th>Ubicación</th>
            <th>Técnico</th>
            <th>Descripción / Trabajo</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th class="texto-derecha">Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </section>
  </main>

  <!-- Modal Nuevo Reporte -->
  <div id="modal-reporte" class="fondo-modal oculto">
    <div class="caja-modal">
      <div class="cabecera-modal">
        <h3>Nuevo Reporte de Falla</h3>
        <button class="boton-cerrar" type="button" onclick="cerrarModal()">&times;</button>
      </div>

      <form id="formulario-solicitud">
        <div class="fila-campos">
          <div class="campo-formulario">
            <label>Categoría</label>
            <select id="categoria">
              <option value="Correctivo" selected>Correctivo</option>
              <option value="Preventivo">Preventivo</option>
            </select>
          </div>

          <div class="campo-formulario">
            <label>Prioridad</label>
            <select id="prioridad">
              <option value="Baja">Baja</option>
              <option value="Media" selected>Media</option>
              <option value="Alta">Alta (Urgente)</option>
            </select>
          </div>
        </div>

        <div id="seccion-preventivo" class="oculto">
          <div class="fila-campos">
            <div class="campo-formulario">
              <label>Fecha Programada</label>
              <input type="date" id="fechaProgramada">
            </div>
            <div class="campo-formulario">
              <label>Frecuencia</label>
              <select id="frecuencia">
                <option value="Única vez">Única vez</option>
                <option value="Semanal">Semanal</option>
                <option value="Mensual">Mensual</option>
                <option value="Semestral">Semestral</option>
                <option value="Anual">Anual</option>
              </select>
            </div>
          </div>
        </div>

        <div class="fila-campos">
          <div class="campo-formulario">
            <label>Ubicación / Área</label>
            <select id="idAreaEquipo" required>
              <option value="1">Aula 3</option>
              <option value="2">Laboratorio de Ciencias</option>
              <option value="3">Bodega Central</option>
              <option value="4">Edificio Administrativo</option>
            </select>
          </div>

          <div class="campo-formulario">
            <label>Técnico Responsable</label>
            <select id="idTecnicoAsignado">
              <option value="">Sin asignar</option>
              <option value="1">Carlos Ramírez</option>
              <option value="2">María Torres</option>
            </select>
          </div>
        </div>

        <div class="campo-formulario">
          <label>Descripción del problema</label>
          <textarea id="descripcion" rows="3" placeholder="Describa el problema detalladamente..." required></textarea>
        </div>

        <div class="pie-modal">
          <button type="button" class="boton-secundario" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="boton-primario">Guardar Reporte</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
