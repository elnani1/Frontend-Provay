<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Provay - Terminal de Mantenimiento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; padding: 24px; min-height: 100vh; }

    .header-terminal {
      background-color: #0f172a;
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .titulo-sistema { font-size: 1.1rem; font-weight: 700; }
    .subtitulo { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    .control-usuario { display: flex; align-items: center; gap: 10px; }
    .control-usuario label { font-size: 0.85rem; color: #cbd5e1; font-weight: 500; }
    .control-usuario select {
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .grid-tablero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .columna-estado {
      background-color: #ffffff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cabecera-columna {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }
    .nombre-columna { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #475569; letter-spacing: 0.05em; }
    .contador-tareas {
      background-color: #f1f5f9;
      color: #475569;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .tarjeta-tarea {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #94a3b8;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .prioridad-Alta { border-left-color: #dc2626; }
    .prioridad-Media { border-left-color: #d97706; }
    .prioridad-Baja { border-left-color: #16a34a; }

    .fila-meta { display: flex; justify-content: space-between; align-items: center; }
    .id-tag { font-size: 0.75rem; font-weight: 700; color: #64748b; }
    .ubicacion-tag { font-size: 0.85rem; font-weight: 700; color: #0f172a; }

    .texto-descripcion { font-size: 0.875rem; color: #334155; line-height: 1.4; }
    .fechas-meta { font-size: 0.75rem; color: #64748b; display: flex; flex-direction: column; gap: 2px; }

    .btn-accion {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-iniciar { background-color: #2563eb; color: #ffffff; }
    .btn-iniciar:hover { background-color: #1d4ed8; }
    .btn-cerrar { background-color: #16a34a; color: #ffffff; }
    .btn-cerrar:hover { background-color: #15803d; }

    .tag-categoria {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .tag-correctivo { background-color: #fee2e2; color: #991b1b; }
    .tag-preventivo { background-color: #ede9fe; color: #6d28d9; }

    .subcabecera-bloque {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background-color: #f8fafc;
      border-radius: 6px;
      border-left: 3px solid #64748b;
      margin-bottom: 8px;
    }
    .subcabecera-correctivo { border-left-color: #ef4444; }
    .subcabecera-preventivo { border-left-color: #8b5cf6; }
    .subtitulo-bloque {
      font-size: 0.78rem;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <header class="header-terminal">
    <div>
      <div class="titulo-sistema">Provay CMMS</div>
      <div class="subtitulo">Terminal Operativa de Mantenimiento</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #1e293b; padding: 6px 14px; border-radius: 6px; border: 1px solid #334155;">
      <span style="font-size: 0.85rem; font-weight: 600; color: #38bdf8;">Técnico General</span>
    </div>
  </header>

  <main class="grid-tablero">
    <section class="columna-estado">
      <div class="cabecera-columna">
        <span class="nombre-columna">Tareas Asignadas</span>
        <span id="badge-pendientes-total" class="contador-tareas">0</span>
      </div>

      <!-- Sección Superior: Correctivos -->
      <div>
        <div class="subcabecera-bloque subcabecera-correctivo">
          <span class="subtitulo-bloque">Correctivo (Fallas)</span>
          <span id="badge-pendientes-correctivo" class="contador-tareas">0</span>
        </div>
        <div id="contenedor-pendientes-correctivo" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>

      <!-- Sección Inferior: Preventivos -->
      <div style="margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e2e8f0;">
        <div class="subcabecera-bloque subcabecera-preventivo">
          <span class="subtitulo-bloque">Preventivo (Programados)</span>
          <span id="badge-pendientes-preventivo" class="contador-tareas">0</span>
        </div>
        <div id="contenedor-pendientes-preventivo" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </section>

    <section class="columna-estado">
      <div class="cabecera-columna">
        <span class="nombre-columna">En Ejecución</span>
        <span id="badge-proceso" class="contador-tareas">0</span>
      </div>
      <div id="contenedor-proceso" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </section>
  </main>

  <script>
    const API_URL = "http://localhost:5019";

    async function cargarTareas() {
      const listaCorrectivos = document.getElementById("contenedor-pendientes-correctivo");
      const listaPreventivos = document.getElementById("contenedor-pendientes-preventivo");
      const listaProceso = document.getElementById("contenedor-proceso");
      listaCorrectivos.innerHTML = "";
      listaPreventivos.innerHTML = "";
      listaProceso.innerHTML = "";

      try {
        const res = await fetch(`${API_URL}/solicitudes/activas`);
        if (!res.ok) throw new Error("Error al obtener solicitudes");
        const solicitudes = await res.json();

        // En la empresa hay un único técnico, todas las solicitudes activas van a su terminal
        const misTareas = solicitudes;

        let contCorrectivos = 0;
        let contPreventivos = 0;
        let contProceso = 0;

        misTareas.forEach(s => {
          let fechasHTML = `<div>Reportado: <strong>${s.fechaSolicitud}</strong></div>`;
          if (s.fechaAsignacion) {
            fechasHTML += `<div>Iniciado: <strong>${s.fechaAsignacion}</strong></div>`;
          }
          if (s.categoria === 'Preventivo' && s.fechaProgramada) {
            fechasHTML += `<div style="color: #2563eb; font-weight: 600;">Programado: ${s.fechaProgramada} (${s.frecuencia || 'Única vez'})</div>`;
          }

          const tagClase = s.categoria === 'Preventivo' ? 'tag-preventivo' : 'tag-correctivo';

          const tarjeta = `
            <div class="tarjeta-tarea prioridad-${s.prioridad}">
              <div class="fila-meta">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="id-tag">#${s.id}</span>
                  <span class="tag-categoria ${tagClase}">${s.categoria}</span>
                </div>
                <span class="ubicacion-tag">${s.areaEquipo}</span>
              </div>
              <p class="texto-descripcion">${s.descripcion}</p>
              <div class="fechas-meta">${fechasHTML}</div>
              ${s.estado === 'Pendiente'
                ? `<button class="btn-accion btn-iniciar" onclick="actualizarEstado(${s.id}, 'En Proceso')">Iniciar Trabajo</button>`
                : `<button class="btn-accion btn-cerrar" onclick="completarTarea(${s.id})">Completar Tarea</button>`
              }
            </div>
          `;

          if (s.estado === 'Pendiente') {
            if (s.categoria === 'Preventivo') {
              listaPreventivos.innerHTML += tarjeta;
              contPreventivos++;
            } else {
              listaCorrectivos.innerHTML += tarjeta;
              contCorrectivos++;
            }
          } else if (s.estado === 'En Proceso') {
            listaProceso.innerHTML += tarjeta;
            contProceso++;
          }
        });

        document.getElementById("badge-pendientes-total").innerText = contCorrectivos + contPreventivos;
        document.getElementById("badge-pendientes-correctivo").innerText = contCorrectivos;
        document.getElementById("badge-pendientes-preventivo").innerText = contPreventivos;
        document.getElementById("badge-proceso").innerText = contProceso;

        if (contCorrectivos === 0) listaCorrectivos.innerHTML = `<div style="font-size: 0.8rem; color: #94a3b8; text-align: center; padding: 14px;">Sin fallas correctivas pendientes.</div>`;
        if (contPreventivos === 0) listaPreventivos.innerHTML = `<div style="font-size: 0.8rem; color: #94a3b8; text-align: center; padding: 14px;">Sin mantenimientos preventivos pendientes.</div>`;
        if (contProceso === 0) listaProceso.innerHTML = `<div style="font-size: 0.85rem; color: #94a3b8; text-align: center; padding: 24px;">No hay trabajos en ejecución.</div>`;

      } catch (error) {
        console.error("Error al sincronizar:", error);
      }
    }

    async function actualizarEstado(id, nuevoEstado, nota = null) {
      try {
        const res = await fetch(`${API_URL}/solicitudes/${id}/estado`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nuevoEstado: nuevoEstado, notaResolucion: nota })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.Mensaje) {
            alert(data.Mensaje);
          }
        }
        cargarTareas();
      } catch (error) {
        console.error("Error al actualizar estado:", error);
      }
    }

    function completarTarea(id) {
      const nota = prompt("Ingrese nota de lo realizado (refacciones usadas, trabajo hecho):");
      if (nota !== null) {
        actualizarEstado(id, "Cerrado", nota.trim() === "" ? "Trabajo concluido" : nota.trim());
      }
    }

    cargarTareas();
  </script>
</body>
</html>
